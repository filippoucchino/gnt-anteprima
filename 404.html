<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | GNT Officine Meccaniche</title>
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --ink: #1c1c1c;
    --ink-soft: #4d4d4d;
    --line: #d6d6d2;
    --line-strong: #8a8a86;
    --focus: #1c1c1c;
    --radius: 6px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.55;
  }
  main {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 16px;
  }
  @media (min-width: 640px) { main { padding: 64px 32px; } }
  .logo { display: block; width: 132px; height: auto; margin-bottom: 28px; }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.125rem);
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p { margin: 0 0 24px; color: var(--ink-soft); font-size: 1.0625rem; }
  .back {
    display: inline-block;
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; text-underline-offset: 3px; }
  .back:focus { outline: none; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/gnt-anteprima/media/logo/svg/gnt-logo-colori.svg" width="292" height="132" alt="GNT Officine Meccaniche">
    <h1>Pagina non trovata</h1>
    <p>L'indirizzo che hai aperto non corrisponde a nessuna pagina di questa anteprima. Dalla pagina d'ingresso puoi aprire le quattro proposte per la homepage.</p>
    <a class="back" href="/gnt-anteprima/">Torna alla pagina d'ingresso</a>
  </main>
</body>
</html>
